name: SCTV1

on:
  workflow_dispatch: # Cho phép bạn chạy thủ công từ tab Actions
  schedule:
    - cron: '0 * * * *' # Tự động chạy lại mỗi giờ để tránh timeout

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          ffmpeg -re -i "https://hoiquan.dpdns.org/VTVGo/?sctv1" \
          -c copy -f flv rtmp://42.1.99.192/live/sctv1
