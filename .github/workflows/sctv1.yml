name: Stream HTV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start Streaming
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -re -analyzeduration 10000000 -probesize 10000000 -i "https://vpsttt.vietanhtv.top/htv/htv.php?id=2631" -c copy -f flv rtmp://42.1.99.192/live/htv1 &
          ffmpeg -re -analyzeduration 10000000 -probesize 10000000 -i "https://vpsttt.vietanhtv.top/vieon/vieon.php?id=vie-channel-htv2-hd" -c copy -f flv rtmp://42.1.99.192/live/htv2hd &
          ffmpeg -re -analyzeduration 10000000 -probesize 10000000 -i "https://vpsttt.vietanhtv.top/htv/htv.php?id=2535" -c copy -f flv rtmp://42.1.99.192/live/htv3 &
          ffmpeg -re -analyzeduration 10000000 -probesize 10000000 -i "https://vpsttt.vietanhtv.top/htv/htv.php?id=2528" -c copy -f flv rtmp://42.1.99.192/live/htvkey &
