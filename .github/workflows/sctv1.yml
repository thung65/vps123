name: IPTV Stream Controller

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Chọn hành động'
        required: true
        default: 'start'
        options:
          - start
          - stop

jobs:
  control_stream:
    runs-on: self-hosted  # Chạy trực tiếp trên VPS Việt Nam của bạn
    steps:
      - name: Start or Stop Stream
        run: |
          if [ "${{ github.event.inputs.action }}" == "start" ]; then
            echo "Đang khởi động luồng..."
            # Dùng nohup để FFmpeg chạy nền, không bị tắt khi xong workflow
            # Thêm User-Agent để tránh bị chặn
            nohup ffmpeg -re -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -i "https://hoiquan.dpdns.org/VTVGo/?sctv1" \
            -c copy -f flv rtmp://42.1.99.192/live/vtv1 > stream.log 2>&1 &
            echo "Luồng đã chạy ngầm!"
          else
            echo "Đang dừng luồng..."
            pkill -f ffmpeg
            echo "Đã dừng tất cả các luồng!"
          fi
