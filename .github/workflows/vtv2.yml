name: IPTV Streamer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  stream-vtv1-vtv5:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Stream Channels
        run: |
          # vtv1
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/vtv1-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv1 &
          # vtv2
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv2/live247-hls-avc/vtv2-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv2 &
          # vtv3
          ffmpeg -re -i "https://live-a.fptplay53.net/live/media/vtv3/live247-hls-avc/vtv3-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv3 &
          # vtv4
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv4/live247-hls-avc/vtv4-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv4 &
          # vntoday
          ffmpeg -re -i "https://live.fptplay53.net/fnxhd1/vntoday_vhls.smil/chunklist_b5000000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vntoday &
          # vtv5
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv5/live247-hls-avc/vtv5-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv5 &
          wait

  stream-vtv5tnb-vtv10:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Stream Channels
        run: |
          # vtv5tnb
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv5tnb/live-hls-avc/vtv5tnb-avc1_4000000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv5tnb &
          # vtv5tn
          ffmpeg -re -i "https://live.fptplay53.net/fnxhd1/vtv5taynguyen_vhls.smil/chunklist_b5000000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv5tn &
          # vtv6
          ffmpeg -re -i "https://live-a.fptplay53.net/live/media/vtv6/live247-hls-avc/vtv6-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv6 &
          # vtv7
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv7/live247-hls-avc/vtv7-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv7 &
          # vtv8
          ffmpeg -re -i "https://live.fptplay53.net/epzhd1/vtv8hd_vhls.smil/chunklist_b5000000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv8 &
          # vtv9
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv9/live247-hls-avc/vtv9-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv9 &
          # vtv10
          ffmpeg -re -i "https://live.fptplay53.net/live/media/vtv10/live247-hls-avc/vtv10-avc1_5600000=10000-mp4a_131600=20000.m3u8" -t 21000 -c copy -f flv rtmp://42.1.99.192/live/vtv10 &
          wait
