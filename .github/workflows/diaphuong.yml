          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=danang2" -c copy -f flv rtmp://42.1.99.192/live/danang2 &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=dongnai1" -c copy -f flv rtmp://42.1.99.192/live/dongnai1 &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=dongnai2" -c copy -f flv rtmp://42.1.99.192/live/dongnai2 &
