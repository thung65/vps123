name: Local Channels Streamer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  stream-local-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Stream Local 1
        run: |
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=angiang1" -c copy -f flv rtmp://42.1.99.192/live/angiang1 &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=angiang2" -c copy -f flv rtmp://42.1.99.192/live/angiang2 &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=angiang3" -c copy -f flv rtmp://42.1.99.192/live/angiang3 &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=bacninh" -c copy -f flv rtmp://42.1.99.192/live/bacninh &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=caobang" -c copy -f flv rtmp://42.1.99.192/live/caobang &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=camau" -c copy -f flv rtmp://42.1.99.192/live/camau &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=cantho1" -c copy -f flv rtmp://42.1.99.192/live/cantho1 &
          ffmpeg -re -i "https://sgchill.duckdns.org/source/fptplay.m3u8?id=cantho2" -c copy -f flv rtmp://42.1.99.192/live/cantho2 &
          wait

