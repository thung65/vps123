<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu - Trần Tất Khôi<title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            
        }
        .fa-zalo {
    background: url('https://i.pinimg.com/736x/6b/3a/44/6b3a44206a93e2f6c3cc79065365a76e.jpg') no-repeat center center;
    background-size: contain;
    width: 18px; /* Điều chỉnh kích thước cho khớp với các icon khác */
    height: 18px;
    display: inline-block;
    vertical-align: middle;
}
        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 1rem;
        }
        h1 { margin: 10px 0; color: #333; }
        .role { color: #666; font-style: italic; margin-bottom: 15px; }
        .bio { color: #555; line-height: 1.6; margin-bottom: 25px; }
        
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .social-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }
        .social-item:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
        .social-item i { margin-right: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://vietanhtv.id.vn/avata.jpg" alt="Avatar" class="avatar">
    <h1>Trịnh Việt Anh</h1>
    <div class="role">Web Developer & Tech Enthusiast</div>
    <p class="bio">Chào mừng bạn đã ghé thăm trang cá nhân của mình. Mình yêu thích lập trình, sáng tạo nội dung và kết nối với mọi người.</p>

    <div class="social-links">
                    <a href="https://facebook.com/vietanhtvgroup" 
               class="social-item" 
               target="_blank" 
               style="background-color: #1877F2;">
                <i class="fab fa-facebook-f"></i>
                Facebook            </a>
                    <a href="https://zalo.me/0395062258" 
               class="social-item" 
               target="_blank" 
               style="background-color: #0068FF;">
                <i class="fa-zalo"></i>
                Zalo            </a>
                    <a href="https://www.tiktok.com/@vietanhanime?_r=1&_t=ZS-94H9e7myEjo" 
               class="social-item" 
               target="_blank" 
               style="background-color: #000000;">
                <i class="fa-brands fa-tiktok"></i>
                TikTok            </a>
                    <a href="https://www.instagram.com/vietanhtvgroup?igsh=bWE4emFseDQ2aXVl" 
               class="social-item" 
               target="_blank" 
               style="background-color: #E4405F;">
                <i class="fab fa-instagram"></i>
                Instagram            </a>
            </div>
</div>

</body>
</html>
